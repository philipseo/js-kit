name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish to npm
        working-directory: packages/configs
        run: |
          VERSION=$(jq -r .version package.json)
          if npm view "@philipseo/configs@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published @philipseo/configs@${VERSION}"
            exit 0
          fi
          npm publish

      - name: Push git tag
        run: |
          VERSION=$(jq -r .version packages/configs/package.json)
          TAG="@philipseo/configs@${VERSION}"
          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/${TAG}"
