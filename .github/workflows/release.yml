name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Version packages
        env:
          HUSKY: 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pnpm changeset version

          git add -A
          if git diff --cached --quiet; then
            echo "No changesets to release"
            exit 1
          fi
          git commit -m "chore: version packages"

      - name: Publish to npm
        working-directory: packages/configs
        run: |
          VERSION=$(jq -r .version package.json)
          if npm view "@philipseo/configs@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published @philipseo/configs@${VERSION}"
            exit 0
          fi
          npm publish

      - name: Push version commit and tag
        run: |
          VERSION=$(jq -r .version packages/configs/package.json)
          TAG="@philipseo/configs@${VERSION}"
          if ! git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null; then
            git tag "$TAG"
          fi
          git push --follow-tags origin HEAD:main
