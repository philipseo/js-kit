name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Version packages
        env:
          HUSKY: 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pnpm changeset version

          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 1
          fi
          git commit -m "chore: version packages"

      - name: Publish to npm
        working-directory: packages/configs
        run: npm publish

      - name: Push tag and open version PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version packages/configs/package.json)
          TAG="@philipseo/configs@${VERSION}"
          BRANCH="changeset-release/main"

          git tag "$TAG"
          git push origin "refs/tags/${TAG}"
          git push origin "HEAD:refs/heads/${BRANCH}" --force

          gh pr view "$BRANCH" --json number >/dev/null 2>&1 || gh pr create \
            --base main --head "$BRANCH" \
            --title "chore: version packages" \
            --body "Published \`${TAG}\` to npm. Merge this PR to sync main."
